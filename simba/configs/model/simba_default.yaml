# Default SIMBA model architecture

# Transformer architecture
transformer:
  d_model: 256
  n_layers: 5
  n_heads: 8
  dropout: 0.1
  context_length: 100

# Backward compatibility - DO NOT REMOVE
# These fields are needed for loading old checkpoints
transformer_context: 100  # Alias for transformer.context_length
d_model: 256  # Alias for transformer.d_model
n_layers: 5  # Alias for transformer.n_layers
use_adduct: false  # Alias for features.use_adduct
use_cosine_distance: true  # Alias for tasks.cosine_similarity.use_cosine_distance
use_ce: false  # Alias for features.use_ce
use_ion_activation: false  # Alias for features.use_ion_activation
use_ion_method: false  # Alias for features.use_ion_method

# Model features
features:
  use_adduct: false
  use_precursor_mz: true
  use_element_wise: true
  use_only_protonized_adducts: false
  use_ion_mode: false

  # Metadata features
  use_ce: false
  use_ion_activation: false
  use_ion_method: false

# Task configuration
tasks:
  # MCES (Maximum Common Edge Substructure) task
  mces:
    threshold: 20
    max_value: 40
    # Bin edges for the validation MAE/overlap diagnostics (bin 0 is always
    # self-pairs, these are the upper edges of the remaining bins).
    mae_bin_edges: [5, 10, 15, 20, 25, 30, 35, 40]
    # Retrieval benchmark: for each validation molecule with >=2 spectra,
    # rank it against its hit_at_k_n_decoys nearest (by GT MCES) other
    # validation molecules and check whether its true match lands in the
    # top hit_at_k_ks.
    hit_at_k_n_decoys: 255
    hit_at_k_ks: [1, 5, 20]

  # Cosine similarity task
  cosine_similarity:
    use_cosine_distance: true

  # Optional second target: an auxiliary CORN-style ordinal classification
  # head on MCES, trained in parallel with the primary task. Buckets: 0 is
  # its own class (self-pairs); bin_edges are the upper edges of the
  # remaining left-open/right-closed bins, e.g. [2,4,6,8] -> 0, (0,2],
  # (2,4], (4,6], (6,8], (8,inf).
  mces_bucket:
    enabled: false
    bin_edges: [2, 4, 6, 8]
    use_mlp: false
    loss_weight: 1.0
    # Build bucket_repr from abs(mean of valid tokens0 - mean of valid
    # tokens1) (plain masked mean, no learned weights) instead of
    # abs(emb0 - emb1) from the CLS embeddings. Everything downstream
    # (optional use_mlp, the bucket head, CORN loss/target/decode) is
    # unchanged. Only meaningful when tasks.filip.enabled is also true.
    use_filip_tokens: false

  contrastive:
    enabled: false
    temperature: 0.07
    loss_weight: 1.0
    use_projection_head: false
    use_filip_tokens: false

  spectral_cosine:
    enabled: false
    loss_weight: 1.0
    bin_width: 0.01
    max_mz: 1100.0
    # Score this head with the FILIP token-interaction mechanism (mirroring
    # whichever aggregation/cross-attention/importance-weighting the
    # primary filip head uses, via its own dedicated per-token projection
    # and weights) instead of pooled-CLS-embedding cosine. Only meaningful
    # when tasks.filip.enabled is also true.
    use_filip_tokens: false

  filip:
    enabled: false
    # Only used when use_cross_attention is false: how each direction's
    # per-token scores get combined across the other spectrum's valid
    # tokens. "soft_max" (default): learned-temperature log-mean-exp,
    # interpolates between the two options below as training adjusts the
    # temperature. "hard_max": literal max -- the original FILIP paper's
    # mechanism, no learned parameter for this step. "mean": literal
    # unweighted average -- no max, no attention at all.
    aggregation: soft_max
    # Replace the max/log-mean-exp token aggregation with learned
    # cross-attention (each spectrum's tokens attend over the other's
    # valid tokens instead of picking a single best match).
    use_cross_attention: false
    # Only meaningful when use_cross_attention is true: combine the raw
    # cosine-similarity matrix with the learned attention weights (avoids
    # blending raw token vectors before comparing, which can cancel out
    # real signal), instead of blending raw tokens then comparing once.
    cross_attention_weight_similarities: false
    # Weight the per-token pooling by a learned, independent (sigmoid)
    # importance gate instead of a plain mean, so a distinctive/diagnostic
    # peak can matter more than a generic one. Works with either
    # aggregation mode above.
    use_importance_weighting: false

# Multitasking
multitasking:
  enabled: true

# Data columns (for multitasking)
data_columns:
  edit_distance: 2
  mces20: 3

# Pretraining & Loading
pretrained:
  load_pretrained: false
  load_maldi_embedder: false
  maldi_embedder_path: null
